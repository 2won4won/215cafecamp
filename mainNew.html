    body,

    /*  bbq  */
    .bbq {
      .boxSize {
        padding-top: 1rem;
        display: flex; /* 💡 이미지와 설명창이 나란히 배치되도록 플렉스 추가 */
        justify-content: space-between;
        
        .img {
          display: block;
          width: 59%;
          height: auto; /* 💡 auto 대신 구체적인 세로 크기(예: 8rem)를 지정해야 배경이 보입니다! */
          box-sizing: border-box;
        }
        .description {
          width: 38%;
          line-height: 1.5rem;
        } 
        .ko {
          margin-left: 0;
        }
      } 
      #campWe  { width: 100%; height: 2.5rem; margin: 1.6rem 0; }

    /* 💡 SIDE 카테고리 그리드 레이아웃 교정 및 피자 배치 */
    .side {
      .boxTwo {
        /* 첫 번째 줄은 피자용(12rem), 두 번째 줄부터는 일반 아이템 크기 자동(auto) */
        grid-template-rows: 9rem 10rem 9rem; 
        gap: 1.5rem;
      }
      .lightingBox {
        width: 100%;
        height: 10rem;
        box-sizing: border-box;
        border-radius: 1.5rem;
        overflow: hidden; /* 둥근 모서리 내부 격리 */
        
        .img {
          width: 50%;
          /* aspect-ratio: 1/1; */ /* 일반 아이템 정사각형 유지 */
          display: flex;
          justify-content: center;
          align-items: center;
        }
      }

      /* 💡 피자 아이템만 최상단(order: -1) 및 100% 가로 전면 채우기 */
      .lightingBox.pizza-full-width {
        grid-column: 1 / -1; 
        width: 100% !important;
        height: 11rem; /* 높이 규정 지정 */
        order: -1; /* 다른 일반 요소들을 제치고 무조건 최상단 정렬 */
      }

      /* Swiper 컨테이너 정렬 확보 */
      .swiper-container.pizza-slider {
        margin-top: 0;
        width: 100%;
        height: 11rem;/* .lightingBox.pizza-full-width 높이 동일 지정 */
      }

      /* 피자 슬라이더 내부 개별 아이템 구조 정렬 */
      .swiper-slide.img {
        width: 100%;
        height: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        aspect-ratio: auto; /* 지정 높이에 따름 */
      }

      /* 공통 설명창 스타일링 보완 */
      .description {
        width: auto;
        box-sizing: border-box;
        padding: 1rem 1.5rem;
        display: flex;
        flex-direction: column;
        gap: 0.4rem;

        transform: translateY(-50%); /* 💡 자식 높이 절반만큼 끌어올려 완벽한 수직 중앙 정렬 */
        right: -3.3rem;  
      }

    }

<script>

$(document).ready(function(){

$(document).ready(function() {
  
  function renderCategory(dataList, containerId, templateId, isFlower) {
    const selector = containerId.startsWith('#') ? containerId : `#${containerId}`;
    const $container = $(selector);
    const tplSelector = templateId.startsWith('#') ? templateId : `#${templateId}`;
    const template = document.querySelector(tplSelector);
    if (!template) return;

    $.each(dataList, function(index, item) {
      const clone = document.importNode(template.content, true);
      const $newItem = $(clone).children().first();

      // 💡 피자 아이템일 경우 고유 클래스 추가
      if (item.isPizza) {
        $newItem.addClass('pizza-full-width'); 
      }

      // 💡 [조건 분기] 피자 세분화 데이터인 경우
      if (item.isPizza && item.subItems) {
        $newItem.find('.normal-item').remove(); // 일반 레이아웃 삭제
        const $slider = $newItem.find('.pizza-slider').show(); 
        const $wrapper = $slider.find('.swiper-wrapper');

        // 세분화된 하위 피자 루프 돌며 슬라이드 생성
        $.each(item.subItems, function(subIndex, subItem) {
          const priceShort = (subItem.price / 1000).toFixed(1);
          
          const slideHtml = `
            <div class="swiper-slide img imgBack" 
                 style="background-image: url(${subItem.img}); 
                 background-size: cover; 
                 background-position: center;"
            >
              <div class="description">
                <div class="disJcBet underline">
                  <div class="ko">${subItem.ko}</div>
                  <div class="price">${priceShort}</div>
                </div>
                <div class="ex tr">${subItem.ex}</div>
              </div>
            </div>
          `;
          $wrapper.append(slideHtml);
        });

        $container.append($newItem);

        // Swiper 가동
        new Swiper($slider[0], {
          loop: true,
          autoplay: { delay: 3000, disableOnInteraction: false },
          slidesPerView: 2, 
          spaceBetween: 5 
        });

            } else {
        // 💡 일반 아이템 처리 로직
        $newItem.find('.pizza-slider').remove(); // 슬라이더 DOM 제거
        
        // [수정] .img 요소를 확실하게 찾아서 배경 스타일을 주입합니다.
        const $imgElement = $newItem.hasClass('img') ? $newItem : $newItem.find('.img');
        
        if (item.img) {
          $imgElement
            .addClass("imgBack")
            .css({
              'background-image': `url(${item.img})`,
              'background-size': 'cover',   
              'background-position': 'center',
              'display': 'block' // 💡 상위 CSS 배치에 방해받지 않도록 블록 처리 확보
            });
        }

        const priceShort = (item.price / 1000).toFixed(1);
        
        $newItem.find('.ko').text(item.ko);
        $newItem.find('.price').text(priceShort);
        $newItem.find('.en').html(item.en);
        // $newItem.find('.ex').html(item.ex);
      
// 💡 [교정] Peach Iced Tea 아이템일 경우 특수 설명창(ex) 처리 및 아이콘 빌드
if (item.en === "Peach Iced Tea") {
  // 1. 기존에 들어가던 일반 ex 텍스트 상자를 선택
  const $exElement = $newItem.find('.ex');
  
  // 2. CSS 구조에 맞게 .ex 박스 자체에 relative 기준점을 주거나 
  // 내부에 .wPeach 아이콘 상자를 만들어 배치합니다.
  $exElement.html(`
    <span class="wPeach"></span>
    <span class="ex-img" >${item.ex || '시원 달콤한 아이스티'}</span>
  `);
} else {
  // 일반 아이템은 기존 방식 유지
  if (item.ex) $newItem.find('.ex').html(item.ex);
}
        $container.append($newItem);
      }

    });
  }

  // 데이터 동적 호출 등록
  renderCategory(bbqData, 'bbqContainer', 'bbqTemplate');
  // renderCategory(sideData, 'sideContainer', 'sideTemplate');
  renderCategory(caffeData, 'caffeContainer', 'caffeTemplate');
  renderCategory(fruitData, 'fruitContainer', 'fruitTemplate');
  renderCategory(summerData, 'summerContainer', 'summerTemplate');
  renderCategory(flowerData, 'flowerContainer', 'flowerTemplate', true );
});
</script>
